# Prometheus Configuration for X402 Facilitator

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'x402-facilitator'
    environment: 'production'

# Scrape configurations
scrape_configs:
  # X402 Facilitator metrics
  - job_name: 'facilitator'
    static_configs:
      - targets: ['facilitator:3002']
        labels:
          service: 'x402-facilitator'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alerting rules (optional - configure alertmanager separately)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files for alerts
# rule_files:
#   - 'alerts/*.yml'
