[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xeepy"
version = "0.1.0"
description = "🚀 Professional X/Twitter automation toolkit with CLI and REST API"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Xeepy Contributors", email = "support@xeepy.dev"}
]
maintainers = [
    {name = "Xeepy Contributors", email = "support@xeepy.dev"}
]
keywords = [
    "twitter",
    "x",
    "automation",
    "social-media",
    "cli",
    "api",
    "fastapi",
    "ai",
    "machine-learning",
    "analytics",
    "bot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "aiofiles>=23.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
# API features
api = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "starlette>=0.27.0",
    "python-multipart>=0.0.6",
    "websockets>=11.0",
]

# Authentication
auth = [
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
]

# AI providers
ai = [
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "ollama>=0.1.0",
    "tiktoken>=0.5.0",
]

# OpenAI only
openai = [
    "openai>=1.0.0",
    "tiktoken>=0.5.0",
]

# Anthropic only
anthropic = [
    "anthropic>=0.7.0",
]

# Ollama only
ollama = [
    "ollama>=0.1.0",
]

# Database support
db = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",  # PostgreSQL
    "aiosqlite>=0.19.0",  # SQLite
]

# Redis caching
redis = [
    "redis>=5.0.0",
    "hiredis>=2.2.0",
]

# Monitoring & metrics
monitoring = [
    "prometheus-client>=0.18.0",
    "sentry-sdk[fastapi]>=1.38.0",
]

# Data export
export = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
]

# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.23.0",
]

# Testing
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.0",
    "faker>=20.0.0",
]

# Full installation (all features)
all = [
    "xeepy[api,auth,ai,db,redis,monitoring,export]",
]

[project.urls]
Homepage = "https://xeepy.dev"
Documentation = "https://xeepy.dev/docs"
Repository = "https://github.com/yourusername/xeepy"
Issues = "https://github.com/yourusername/xeepy/issues"
Changelog = "https://github.com/yourusername/xeepy/blob/main/CHANGELOG.md"

[project.scripts]
xeepy = "xeepy.cli.main:main"
xeepy-api = "xeepy.api.server:main"

[tool.setuptools]
packages = ["xeepy"]

[tool.setuptools.package-data]
xeepy = ["py.typed", "*.yml", "*.yaml"]

# =============================================================================
# Black - Code Formatting
# =============================================================================

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | __pycache__
)/
'''

# =============================================================================
# isort - Import Sorting
# =============================================================================

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
skip_glob = ["**/.venv/*", "**/build/*", "**/dist/*"]

# =============================================================================
# Ruff - Linting
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py38"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py

# =============================================================================
# MyPy - Type Checking
# =============================================================================

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "openai.*",
    "anthropic.*",
    "ollama.*",
    "tiktoken.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest - Testing
# =============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests that require API",
    "ai: marks tests that require AI providers",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# =============================================================================
# Coverage - Code Coverage
# =============================================================================

[tool.coverage.run]
source = ["xeepy"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

# =============================================================================
# Bandit - Security Linting
# =============================================================================

[tool.bandit]
exclude_dirs = ["/tests", "/.venv"]
tests = ["B201", "B301"]
skips = ["B101", "B601"]
