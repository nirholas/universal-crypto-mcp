apiVersion: v1
kind: Service
metadata:
  name: ucm-gateway
  namespace: ucm
  labels:
    app: ucm-gateway
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
spec:
  type: ClusterIP
  selector:
    app: ucm-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ucm-gateway-external
  namespace: ucm
  labels:
    app: ucm-gateway
  annotations:
    # For cloud providers
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: ucm-gateway
  ports:
    - name: https
      port: 443
      targetPort: http
      protocol: TCP
  externalTrafficPolicy: Local
---
# Headless service for direct pod access
apiVersion: v1
kind: Service
metadata:
  name: ucm-gateway-headless
  namespace: ucm
  labels:
    app: ucm-gateway
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: ucm-gateway
  ports:
    - name: http
      port: 3000
      targetPort: http
