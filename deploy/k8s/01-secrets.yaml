# Universal Crypto MCP - Secrets
# NOTE: In production, use external-secrets or sealed-secrets
apiVersion: v1
kind: Secret
metadata:
  name: ucm-secrets
  namespace: ucm
type: Opaque
stringData:
  # Payment Configuration
  PAYMENT_WALLET: "0xYourWalletAddressHere"
  
  # Database
  DB_PASSWORD: "changeme-in-production"
  DATABASE_URL: "postgres://postgres:changeme-in-production@postgres:5432/ucm"
  
  # Redis
  REDIS_URL: "redis://redis:6379"
  
  # Monitoring
  SLACK_WEBHOOK: ""
  PAGERDUTY_KEY: ""
  
  # Security
  JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
  
  # API Keys (Optional)
  COINGECKO_API_KEY: ""
  BIRDEYE_API_KEY: ""
  BINANCE_API_KEY: ""
  BINANCE_API_SECRET: ""
  ALCHEMY_API_KEY: ""
---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ucm-config
  namespace: ucm
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  PAYMENT_NETWORK: "eip155:8453"
  PAYMENT_TOKEN: "USDC"
  X402_FACILITATOR: "https://facilitator.x402.org"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_MAX: "100"
  RATE_LIMIT_WINDOW: "60"
  PROMETHEUS_ENABLED: "true"
  ALERTS_ENABLED: "true"
